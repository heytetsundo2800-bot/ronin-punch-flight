<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>浪人パンチフライト</title>
<meta name="description" content="一浪の空で、殴りあえ。4対4の360°空中バトル。スマホでそのまま遊べる無料ゲーム。">
<meta name="theme-color" content="#ffd400">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="浪人パンチ">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="浪人パンチフライト">
<meta property="og:description" content="一浪の空で、殴りあえ。4対4の360°空中バトル！">
<meta property="og:image" content="__ORIGIN__/og.png">
<meta property="og:url" content="__ORIGIN__/">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/app.css?v=__VER__">
<style>
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#ffd400;color:#111;font:900 22px/1.4 'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;z-index:99;transition:opacity .4s}
#boot b{display:block;font-size:13px;font-weight:700;opacity:.7;text-align:center}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="touch"></div>
  <div id="hud"></div>
  <div id="fx" class="fxlayer"></div>
  <div id="screens"></div>
</div>
<div id="boot"><div>浪人パンチフライト<b>よみこみ中…</b></div></div>
<noscript>JavaScript をオンにしてください。</noscript>
<script>
window.addEventListener('error',function(e){try{var b=document.getElementById('boot');if(b&&b.style.opacity!=='0'){b.querySelector('b').textContent='エラー：'+(e.message||'');}}catch(_){}});
</script>
<script src="/app.js?v=__VER__"></script>
<script>
(function(){
  var b=document.getElementById('boot');
  function hide(){ if(b){ b.style.opacity='0'; setTimeout(function(){ b.remove(); },450);} }
  if(document.readyState!=='loading') setTimeout(hide,300); else window.addEventListener('DOMContentLoaded',function(){ setTimeout(hide,300); });
  if('serviceWorker' in navigator && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
